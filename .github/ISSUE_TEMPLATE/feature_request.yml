name: 功能建议
description: 提议一个有明确使用场景、边界和兼容方案的改进
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        请先描述要解决的问题，而不是只给出按钮名或技术方案。项目优先保持零第三方 Python 运行时依赖、最小 root 权限和现有连接兼容。
  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前检查
      options:
        - label: 我已搜索现有 Issue 和文档，没有找到相同建议
          required: true
        - label: 该建议与 Hysteria2-panel 的用户、节点、运维或安全范围直接相关
          required: true
        - label: 内容中不含真实凭据或未脱敏的基础设施信息
          required: true
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 谁在什么场景下遇到了什么困难？当前为什么不够用？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 用用户视角描述理想流程、输入、输出和失败提示。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案
      description: 包括现有绕行方式，以及它们的成本或风险。
  - type: textarea
    id: compatibility
    attributes:
      label: 兼容性与安全影响
      description: 是否影响 URI、token、数据库、备份、节点身份、证书、systemd、root 权限或旧版本？
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 可验收的结果
      description: 列出完成后可以观察或测试的结果。
      placeholder: |
        - [ ] …
        - [ ] …
    validations:
      required: true
