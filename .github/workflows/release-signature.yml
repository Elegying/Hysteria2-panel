name: Sign and publish installer release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag to verify, sign and publish
        required: true
        type: string

permissions:
  actions: read
  contents: write
  id-token: write

concurrency:
  group: installer-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  sign-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Validate release request
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release tag must be strict vX.Y.Z" >&2
            exit 1
          fi
          test "${GITHUB_REF}" = "refs/tags/${RELEASE_TAG}"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release tag is current protected main
        id: source
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          git fetch --force --no-tags origin \
            "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          tag_commit="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          main_commit="$(git rev-parse "origin/main^{commit}")"
          test "${tag_commit}" = "${main_commit}"
          test "$(git rev-parse HEAD)" = "${tag_commit}"
          printf 'tag_commit=%s\n' "${tag_commit}" >>"${GITHUB_OUTPUT}"

      - name: Verify tag and source version
        shell: bash
        run: |
          set -euo pipefail
          test -f install.sh
          test ! -L install.sh
          test "$(wc -c <install.sh)" -gt 0
          test "$(wc -c <install.sh)" -le 1048576
          bash -n install.sh
          python - <<'PY'
          import os
          import pathlib
          import re

          version_source = pathlib.Path("hy2panel/version.py").read_text()
          installer = pathlib.Path("install.sh").read_text()
          version_match = re.search(r'^PANEL_VERSION = "([0-9]+\.[0-9]+\.[0-9]+)"$', version_source, re.MULTILINE)
          installer_match = re.search(r'^PANEL_VERSION="([0-9]+\.[0-9]+\.[0-9]+)"$', installer, re.MULTILINE)
          if not version_match or not installer_match:
              raise SystemExit("release version metadata is missing")
          expected = "v{}".format(version_match.group(1))
          if installer_match.group(1) != version_match.group(1) or os.environ["RELEASE_TAG"] != expected:
              raise SystemExit("release tag does not match source version")
          PY

      - name: Verify exact tag CI run
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_COMMIT: ${{ steps.source.outputs.tag_commit }}
        shell: bash
        run: |
          set -euo pipefail
          runs_payload="$(gh api --method GET \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
            -f event=push -f status=completed -f per_page=100)"
          run_id="$(python .github/scripts/verify_release_run.py select-run \
            --release-tag "${RELEASE_TAG}" \
            --tag-commit "${TAG_COMMIT}" \
            --event push \
            --workflow-path .github/workflows/ci.yml \
            <<<"${runs_payload}")"

          jobs_payload="$(gh api --method GET \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs" \
            -f filter=latest -f per_page=100)"
          python .github/scripts/verify_release_run.py verify-jobs \
            --required release-ref-is-tag \
            --required "test (3.8)" \
            --required "test (3.12)" \
            --required "test (3.13)" \
            --required "browser-smoke" \
            --required static-analysis \
            --required managed-firewall-integration \
            --required systemd-service-semantics \
            --required full-installer-e2e \
            --required rhel-firewall-package-contract \
            <<<"${jobs_payload}"

      - name: Verify exact tag installer platform run
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_COMMIT: ${{ steps.source.outputs.tag_commit }}
        shell: bash
        run: |
          set -euo pipefail
          runs_payload="$(gh api --method GET \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/installer-nightly.yml/runs" \
            -f event=workflow_dispatch -f status=completed -f per_page=100)"
          run_id="$(python .github/scripts/verify_release_run.py select-run \
            --release-tag "${RELEASE_TAG}" \
            --tag-commit "${TAG_COMMIT}" \
            --event workflow_dispatch \
            --workflow-path .github/workflows/installer-nightly.yml \
            <<<"${runs_payload}")"

          jobs_payload="$(gh api --method GET \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs" \
            -f filter=latest -f per_page=100)"
          python .github/scripts/verify_release_run.py verify-jobs \
            --required release-ref-is-tag \
            --required "ubuntu-24.04 / amd64" \
            --required "ubuntu-24.04 / arm64" \
            --required "debian-stable / amd64" \
            --required "debian-stable / arm64" \
            --required "rocky-9 / amd64" \
            --required "rocky-9 / arm64" \
            <<<"${jobs_payload}"

      - name: Create or verify draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "${RELEASE_TAG}" --json id >/dev/null 2>&1; then
            draft="$(gh release view "${RELEASE_TAG}" --json isDraft --jq .isDraft)"
            prerelease="$(gh release view "${RELEASE_TAG}" --json isPrerelease --jq .isPrerelease)"
            if [[ "${draft}" != "true" ]]; then
              echo "release is not a draft" >&2
              exit 1
            fi
            if [[ "${prerelease}" != "false" ]]; then
              echo "release is marked as a prerelease" >&2
              exit 1
            fi
          else
            gh release create "${RELEASE_TAG}" --verify-tag --draft \
              --title "${RELEASE_TAG}" --generate-notes
          fi

      - name: Install pinned Cosign
        uses: sigstore/cosign-installer@ba7bc0a3fef59531c69a25acd34668d6d3fe6f22 # v4.1.0
        with:
          cosign-release: v3.1.3

      - name: Generate deterministic SPDX source inventory
        run: |
          python .github/scripts/generate_release_sbom.py \
            --root . --output sbom.spdx.json
          python -m json.tool sbom.spdx.json >/dev/null

      - name: Sign installer with the GitHub OIDC identity
        run: |
          cosign sign-blob --yes --bundle install.sh.sigstore.json install.sh
          cosign sign-blob --yes --bundle sbom.spdx.json.sigstore.json sbom.spdx.json

      - name: Verify identity and reject a modified installer
        shell: bash
        run: |
          set -euo pipefail
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release-signature.yml@refs/tags/${RELEASE_TAG}"
          cosign verify-blob install.sh \
            --bundle install.sh.sigstore.json \
            --certificate-identity "${identity}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          cp install.sh "${RUNNER_TEMP}/tampered-install.sh"
          printf '\n# tampered\n' >>"${RUNNER_TEMP}/tampered-install.sh"
          if cosign verify-blob "${RUNNER_TEMP}/tampered-install.sh" \
            --bundle install.sh.sigstore.json \
            --certificate-identity "${identity}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com; then
            echo "tampered installer unexpectedly verified" >&2
            exit 1
          fi
          cosign verify-blob sbom.spdx.json \
            --bundle sbom.spdx.json.sigstore.json \
            --certificate-identity "${identity}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com

      - name: Upload signed assets to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${RELEASE_TAG}" install.sh install.sh.sigstore.json sbom.spdx.json sbom.spdx.json.sigstore.json --clobber

      - name: Reverify signed draft and publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          tag_commit="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          main_commit="$(git rev-parse "origin/main^{commit}")"
          test "${tag_commit}" = "${main_commit}"

          draft="$(gh release view "${RELEASE_TAG}" --json isDraft --jq .isDraft)"
          prerelease="$(gh release view "${RELEASE_TAG}" --json isPrerelease --jq .isPrerelease)"
          if [[ "${draft}" != "true" ]]; then
            echo "release is not a draft" >&2
            exit 1
          fi
          if [[ "${prerelease}" != "false" ]]; then
            echo "release is marked as a prerelease" >&2
            exit 1
          fi

          gh release view "${RELEASE_TAG}" --json assets --jq '[.assets[].name]' |
            python -c '
          import json
          import sys

          names = json.load(sys.stdin)
          expected = {"install.sh", "install.sh.sigstore.json", "sbom.spdx.json", "sbom.spdx.json.sigstore.json"}
          if len(names) != len(expected) or set(names) != expected:
              raise SystemExit("draft release has unexpected asset set")
          '

          asset_dir="${RUNNER_TEMP}/verified-release-assets"
          mkdir -p "${asset_dir}"
          gh release download "${RELEASE_TAG}" --dir "${asset_dir}" \
            --pattern install.sh --pattern install.sh.sigstore.json \
            --pattern sbom.spdx.json --pattern sbom.spdx.json.sigstore.json
          test "$(wc -c <"${asset_dir}/install.sh")" -gt 0
          test "$(wc -c <"${asset_dir}/install.sh")" -le 1048576
          test "$(wc -c <"${asset_dir}/install.sh.sigstore.json")" -gt 0
          test "$(wc -c <"${asset_dir}/install.sh.sigstore.json")" -le 5242880
          test "$(wc -c <"${asset_dir}/sbom.spdx.json")" -gt 0
          test "$(wc -c <"${asset_dir}/sbom.spdx.json")" -le 5242880
          test "$(wc -c <"${asset_dir}/sbom.spdx.json.sigstore.json")" -gt 0
          test "$(wc -c <"${asset_dir}/sbom.spdx.json.sigstore.json")" -le 5242880
          cmp --silent install.sh "${asset_dir}/install.sh"
          cmp --silent install.sh.sigstore.json "${asset_dir}/install.sh.sigstore.json"
          cmp --silent sbom.spdx.json "${asset_dir}/sbom.spdx.json"
          cmp --silent sbom.spdx.json.sigstore.json "${asset_dir}/sbom.spdx.json.sigstore.json"
          python -m json.tool "${asset_dir}/sbom.spdx.json" >/dev/null

          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release-signature.yml@refs/tags/${RELEASE_TAG}"
          cosign verify-blob "${asset_dir}/install.sh" \
            --bundle "${asset_dir}/install.sh.sigstore.json" \
            --certificate-identity "${identity}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          cosign verify-blob "${asset_dir}/sbom.spdx.json" \
            --bundle "${asset_dir}/sbom.spdx.json.sigstore.json" \
            --certificate-identity "${identity}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com

          gh release edit "${RELEASE_TAG}" --draft=false --prerelease=false --latest
