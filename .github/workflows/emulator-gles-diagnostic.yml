name: Emulator GLES diagnosis

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/emulator-gles-diagnostic.yml'
      - 'tests/android_gles_probe/**'
      - 'tests/emulator_host_crash.gdb'

permissions:
  contents: read

jobs:
  empty-attachments:
    name: GLES empty attachments (${{ matrix.driver }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        driver: [default, guest-angle]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Start isolated API 36 with host diagnostics
        run: |
          sudo chmod a+rw /dev/kvm
          command -v gdb || { sudo apt-get update && sudo apt-get install -y gdb; }
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          printf '%s\n' "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          export ANDROID_USER_HOME="$RUNNER_TEMP/android-user"
          export ANDROID_EMULATOR_HOME="$ANDROID_USER_HOME"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/android-avd"
          mkdir -p "$ANDROID_USER_HOME" "$ANDROID_AVD_HOME"
          printf 'ANDROID_USER_HOME=%s\nANDROID_EMULATOR_HOME=%s\nANDROID_AVD_HOME=%s\n' \
            "$ANDROID_USER_HOME" "$ANDROID_EMULATOR_HOME" "$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'system-images;android-36;google_apis;x86_64' 'platforms;android-36' \
            'build-tools;36.0.0' emulator platform-tools
          {
            cat "$ANDROID_HOME/emulator/source.properties"
            sha256sum "$ANDROID_HOME/emulator/lib64/libgfxstream_backend.so"
          } > "$RUNNER_TEMP/emulator-environment.txt"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --force \
            --name hy2-gles-probe --package 'system-images;android-36;google_apis;x86_64' \
            --path "$ANDROID_AVD_HOME/hy2-gles-probe.avd"
          (
            cd "$RUNNER_TEMP"
            set +e
            gdb --batch --return-child-result \
              --command "$GITHUB_WORKSPACE/tests/emulator_host_crash.gdb" \
              --args "$ANDROID_HOME/emulator/emulator" -avd hy2-gles-probe \
              -no-window -no-audio -no-boot-anim -no-snapshot -gpu lavapipe -memory 2048 \
              > emulator.log 2>&1
            printf '%s\n' "$?" > emulator-debugger-exit-code.txt
          ) &
          timeout 120 adb -s emulator-5554 wait-for-device
          for _attempt in $(seq 1 180); do
            test "$(adb -s emulator-5554 shell getprop sys.boot_completed | tr -d '\r')" = 1 && break
            sleep 2
          done
          test "$(adb -s emulator-5554 shell getprop sys.boot_completed | tr -d '\r')" = 1
          adb -s emulator-5554 shell input keyevent 82
          {
            adb -s emulator-5554 shell getprop ro.build.fingerprint
            adb -s emulator-5554 shell pm list packages | grep -i angle || true
            adb -s emulator-5554 shell 'ls /system/lib64/egl /vendor/lib64/egl 2>/dev/null || true'
          } >> "$RUNNER_TEMP/emulator-environment.txt" 2>&1
          adb -s emulator-5554 logcat -c
          adb -s emulator-5554 logcat -v threadtime 'Hy2GlesProbe:I' 'GraphicsEnvironment:V' \
            'AndroidRuntime:E' 'DEBUG:E' 'libc:F' '*:S' > "$RUNNER_TEMP/gles-probe-stream.txt" 2>&1 &
      - name: Select guest ANGLE only for the standalone diagnostic
        if: matrix.driver == 'guest-angle'
        run: |
          adb -s emulator-5554 shell settings put global angle_gl_driver_selection_pkgs test.hy2.glesprobe
          adb -s emulator-5554 shell settings put global angle_gl_driver_selection_values angle
      - name: Exercise one and zero framebuffer attachments without Flutter
        run: bash tests/android_gles_probe/run.sh emulator-5554
      - name: Print bounded failure evidence
        if: failure()
        run: |
          cat "$RUNNER_TEMP/gles-probe-stream.txt" || true
          tail -n 25 "$RUNNER_TEMP/emulator.log" | sed '/adb public key/d; /adb.pubkey=/d' || true
          cat "$RUNNER_TEMP/emulator-debugger-exit-code.txt" || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: gles-probe-${{ matrix.driver }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/gles-probe-log.txt
            ${{ runner.temp }}/gles-probe-stream.txt
            ${{ runner.temp }}/gles-probe-apk-sha256.txt
            ${{ runner.temp }}/emulator-environment.txt
            ${{ runner.temp }}/emulator-host-stack.txt
            ${{ runner.temp }}/emulator-debugger-exit-code.txt
          retention-days: 14
