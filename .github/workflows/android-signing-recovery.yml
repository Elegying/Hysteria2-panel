name: Recover Android signing identity
run-name: Android signing ${{ inputs.action }} ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      action:
        description: Export current signing secrets or recover the durable encrypted backup
        type: choice
        options: [restore-backup, export-current]
        default: restore-backup
        required: true
      recipient:
        description: One-time age X25519 public recipient generated on the recovery computer
        type: string
        required: true
      request_id:
        description: Unique 32-character lowercase hexadecimal request ID
        type: string
        required: true

permissions:
  contents: read

jobs:
  recover:
    if: >-
      github.repository == 'Elegying/Hysteria2-panel' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RECIPIENT: ${{ inputs.recipient }}
      REQUEST_ID: ${{ inputs.request_id }}
    steps:
      - name: Validate request before accessing secrets
        shell: bash
        run: |
          set -euo pipefail
          [[ "${RECIPIENT}" =~ ^age1[023456789acdefghjklmnpqrstuvwxyz]{58}$ ]]
          [[ "${REQUEST_ID}" =~ ^[0-9a-f]{32}$ ]]

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Install age from the signed Ubuntu repository
        run: sudo apt-get update && sudo apt-get install -y age

      - name: Export the existing release identity under age encryption
        if: inputs.action == 'export-current'
        env:
          ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: >-
          python .github/scripts/android_signing_recovery.py export-current
          --recipient "$RECIPIENT" --output "$RUNNER_TEMP/backup.json.age"

      - name: Re-encrypt the durable backup for the recovery computer
        if: inputs.action == 'restore-backup'
        env:
          ANDROID_SIGNING_BACKUP_AGE_IDENTITY: ${{ secrets.ANDROID_SIGNING_BACKUP_AGE_IDENTITY }}
        run: >-
          python .github/scripts/android_signing_recovery.py rewrap-backup
          --recipient "$RECIPIENT" --output "$RUNNER_TEMP/backup.json.age"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-signing-${{ github.run_id }}
          path: ${{ runner.temp }}/backup.json.age
          if-no-files-found: error
          retention-days: 1

      - name: Remove encrypted temporary artifact
        if: always()
        run: rm -f -- "$RUNNER_TEMP/backup.json.age"
