name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.8', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit and integration tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python services
        run: python -m py_compile hysteria2_panel.py tcp_probe.py

  static-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install pinned audit tools
        run: python -m pip install ruff==0.12.11 bandit==1.8.6
      - name: Lint Python
        run: ruff check hysteria2_panel.py tcp_probe.py tests
      - name: Audit Python security
        run: bandit -q -r hysteria2_panel.py tcp_probe.py
      - name: Validate installer syntax
        run: bash -n install.sh
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint installer
        run: shellcheck install.sh
      - name: Reject whitespace errors
        run: git diff --check "$(git hash-object -t tree /dev/null)" HEAD
